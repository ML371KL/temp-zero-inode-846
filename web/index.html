<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Модели 850 — справедливая стоимость российских акций</title>
<meta name="description" content="Хаб моделей справедливой стоимости российских акций: медиана и полосы каждой модели против рыночной цены, ближайшие отчёты, свежесть выпусков.">
<meta name="color-scheme" content="light dark">
<script>(function () {
  var DAY = "hub846-theme", NIGHT = "hub846-theme-tonight", FROM = 20, TO = 7;
  function isNight(d) { var h = (d || new Date()).getHours(); return h >= FROM || h < TO; }
  function read(area, key) {
    try { var v = window[area].getItem(key); return v === "light" || v === "dark" ? v : null; }
    catch (e) { return null; }
  }
  function resolve() {
    if (isNight()) return read("sessionStorage", NIGHT) || "dark";
    return read("localStorage", DAY)
      || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function remember(theme) {
    try {
      if (isNight()) window.sessionStorage.setItem(NIGHT, theme);
      else window.localStorage.setItem(DAY, theme);
    } catch (e) { /* приватный режим: тема живёт до перезагрузки */ }
  }
  document.documentElement.dataset.theme = resolve();
  window.__theme = { isNight: isNight, resolve: resolve, remember: remember, from: FROM, to: TO };
})();</script>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<a class="skip" href="#app">К содержанию</a>

<header class="masthead">
  <div class="wrap masthead-row">
    <a class="brand" href="#overview" aria-label="Модели 850 — к обзору">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" class="brand-bg"/>
        <path d="M8.5 10.5h11M13 16h12.5M6.5 21.5h9" class="brand-bars"/>
        <path d="M15.5 6.5v19" class="brand-market"/>
      </svg>
      <span class="brand-text">
        <span class="brand-name">Модели 850</span>
        <span class="brand-sub">справедливая стоимость российских акций</span>
      </span>
    </a>
    <a class="chip" id="status-chip" href="#models" aria-live="polite">
      <span class="chip-dot" aria-hidden="true"></span><span class="chip-text">загружаем модели…</span>
    </a>
    <button id="refresh" class="icon-btn" type="button" aria-label="Обновить данные моделей" title="Обновить данные">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
    </button>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Переключить тему">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-sun" d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.41-1.41M4.93 19.07l1.41-1.41m0-11.32L4.93 4.93m14.14 14.14-1.41-1.41M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/><path class="icon-moon" d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
    </button>
  </div>
  <nav class="wrap tabs" role="tablist" aria-label="Экраны хаба">
    <button class="tab" role="tab" type="button" aria-controls="app" data-screen="overview" aria-selected="true" tabindex="0">Обзор</button>
    <button class="tab" role="tab" type="button" aria-controls="app" data-screen="map" aria-selected="false" tabindex="-1">Карта</button>
    <button class="tab" role="tab" type="button" aria-controls="app" data-screen="calendar" aria-selected="false" tabindex="-1">Календарь</button>
    <button class="tab" role="tab" type="button" aria-controls="app" data-screen="models" aria-selected="false" tabindex="-1">Модели</button>
  </nav>
</header>

<main id="app" class="wrap" tabindex="-1" role="tabpanel" aria-label="Экран хаба">
  <p class="boot">Загружаем модели…</p>
</main>

<footer class="wrap colophon">
  <p id="colophon">Модели 850 · хаб справедливых стоимостей</p>
  <div class="colophon-row">
    <p class="disclaimer">Аналитический инструмент с явными допущениями каждой модели. Не инвестиционная рекомендация.</p>
    <form method="post" action="/logout" class="forget">
      <button type="submit" class="link-btn">Забыть это устройство</button>
    </form>
  </div>
</footer>

<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="/app.js" defer></script>
</body>
</html>
