# Выкладка хаба в Cloudflare Pages (проект tzi-846 → https://tzi-846.pages.dev).
#
# Срабатывает на push в ветку репозитория по умолчанию (и вручную). Нужны
# секреты репозитория (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — токен с правом «Cloudflare Pages: Edit»;
#   CLOUDFLARE_ACCOUNT_ID  — идентификатор аккаунта Cloudflare;
#   HUB_PASSWORD           — необязательно: пароль хаба. Если задан, каждая
#                            выкладка переносит его в секрет проекта Pages;
#                            можно вместо этого задать пароль прямо в Cloudflare.
# Без токена и аккаунта шаги выкладки пропускаются (джоб зелёный, с пометкой).
name: deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

env:
  PROJECT: tzi-846
  WRANGLER: wrangler@4.135.0

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HUB_PASSWORD: ${{ secrets.HUB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Тесты
        run: npm test
      - name: Есть ли доступ к Cloudflare
        id: cf
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Секретов CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID нет — выкладка пропущена (README, раздел «Первый запуск»)."
          fi
      - name: Проект Pages (создаётся при первом запуске)
        if: steps.cf.outputs.ready == 'true'
        run: |
          if npx --yes "$WRANGLER" pages project list | grep -qw "$PROJECT"; then
            echo "проект $PROJECT есть"
          else
            npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch main
          fi
      - name: Пароль хаба → секрет проекта
        if: steps.cf.outputs.ready == 'true' && env.HUB_PASSWORD != ''
        run: printf '%s' "$HUB_PASSWORD" | npx --yes "$WRANGLER" pages secret put HUB_PASSWORD --project-name "$PROJECT"
      - name: Выкладка
        if: steps.cf.outputs.ready == 'true'
        run: >
          npx --yes "$WRANGLER" pages deploy web
          --project-name "$PROJECT"
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "$(git log -1 --pretty=%s | head -c 300)"
